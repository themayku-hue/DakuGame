 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090c13">
  <title>Prison Break - Escape Mission</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">

    <header class="topbar">
      <div class="brand">
        <div class="brand-title">🔒 PRISON BREAK</div>
        <div class="brand-subtitle">ESCAPE MISSION</div>
      </div>

      <div class="hud">
        <div class="hud-box">LEVEL <strong id="levelStatus">1</strong></div>
        <div class="hud-box">KEY <strong id="keyStatus">NO</strong></div>
        <div class="hud-box">🪙 <strong id="coinBalance">0</strong></div>
      </div>
    </header>

    <section class="game-panel">

      <canvas id="game" width="800" height="520"></canvas>

      <div id="message" class="message">
        Find the key, open the door and escape!
      </div>

      <div id="overlay" class="overlay">
        <div class="dialog">
          <h2 id="overlayTitle">PRISON BREAK</h2>
          <p id="overlayText">Find the key, avoid guards and escape!</p>
          <button id="startBtn">START GAME</button>
          <button id="menuBtn" class="secondary-btn">LEVEL MENU</button>
        </div>
      </div>

      <div id="levelSelection" class="level-selection">
        <div class="level-menu">
          <h2>PRISON BREAK</h2>
          <p class="menu-subtitle">CHOOSE YOUR ESCAPE LEVEL</p>

          <div class="coin-display">
            🪙 YOUR COINS: <strong id="coinBalanceMenu">0</strong>
          </div>

          <div class="level-info">
            Win: +10 coins &nbsp; | &nbsp; Lose: -2 coins
          </div>

          <div id="levelList" class="level-list"></div>
        </div>
      </div>

    </section>

    <section class="bottom-panel">

      <div class="mobile-controls">
        <button type="button" data-dir="up">▲</button>
        <button type="button" data-dir="left">◀</button>
        <button type="button" data-dir="down">▼</button>
        <button type="button" data-dir="right">▶</button>
      </div>

      <div class="action-controls">
        <button type="button" id="hideBtn" class="action-btn">HIDE</button>
        <button type="button" id="restartBtn" class="action-btn restart">↻ RESTART</button>
        <button type="button" id="levelsBtn" class="action-btn">LEVELS</button>
      </div>

    </section>

    <div class="control-hint">
      PC: WASD / ARROW KEYS &nbsp; | &nbsp; MOBILE: BUTTONS
    </div>

  </main>

  <script src="game.js"></script>
</body>
</html>
